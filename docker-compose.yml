services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: adeli_chat
      POSTGRES_PASSWORD: adeli_chat
      POSTGRES_DB: adeli_chat
    ports:
      - "127.0.0.1:35438:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adeli_chat"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres:
