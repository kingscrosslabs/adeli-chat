name: CI

# Typecheck, lint, test and build every pull request and every push to main.
# The tests need no database server, network or secrets: each test file runs
# on in-memory PGlite and a fake fetch stands in for Adeli. Migrations run in
# Vercel's build (`vercel-build`), not here.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    # GitHub-hosted: this repo is public, so fork PRs must not reach a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
